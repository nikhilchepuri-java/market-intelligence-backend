name: Backend CI

on:
  push:
    branches: [ main, 'v2-*' ]
  pull_request:
    branches: [ main, 'v2-*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: mvn -B test
      - name: Package application
        run: mvn -B -DskipTests package
