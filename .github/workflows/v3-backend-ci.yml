name: V3 Backend CI
on:
  push:
    branches: [ main, 'v3-*' ]
  pull_request:
    branches: [ main, 'v3-*' ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B test
